[package]
name = "optimize-row-tracking-table"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["arrow"]
arrow = ["arrow-59"]
arrow-59 = ["common/arrow-59"]
arrow-58 = ["common/arrow-58"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
common = { path = "../common", default-features = false }
delta_kernel = { path = "../../../kernel", features = ["default-engine-base"] }
delta_kernel_default_engine = { path = "../../../default-engine", features = ["rustls"] }
env_logger = "0.11.8"
tokio = { version = "1.0", features = ["full"] }
url = "2"

# for cargo-release
[package.metadata.release]
release = false
