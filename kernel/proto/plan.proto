// Proto mirror of `kernel/src/plans/ir/{plan,nodes}.rs` (the Rust IR is the source of truth).
//
// A plan is a DAG of plan nodes: `Plan` is a flat list of `PlanNode`s, and each node wires
// into the DAG by referencing other nodes' positions (indices into `Plan.nodes`) in its
// `inputs`. A node is identified by its index; the terminal node is the last entry. Field
// numbers are never reused once published, so the wire stays compatible.

syntax = "proto3";

package delta.kernel.plan;

// Java package for generated bindings. Ignored by prost (Rust codegen).
option java_package = "io.delta.kernel.proto.plan";

import "expressions.proto";
import "schema.proto";

message FileMeta {
  string location = 1;
  uint64 size = 2;
  int64 last_modified = 3;  // milliseconds since epoch
}

// ============================================================================
// Source payloads (0 inputs)
// ============================================================================

message ScanFile {
  FileMeta meta = 1;
  repeated delta.kernel.expressions.Scalar file_constants = 2;
}

message ScanParquetNode {
  repeated ScanFile files = 1;
  repeated string file_constant_columns = 2;
  delta.kernel.schema.StructType schema = 3;
}

message ScanJsonNode {
  repeated ScanFile files = 1;
  repeated string file_constant_columns = 2;
  delta.kernel.schema.StructType schema = 3;
}

message ValuesRow {
  repeated delta.kernel.expressions.Scalar values = 1;
}

message JsonFieldAlias {
  string alias = 1;
  string canonical = 2;
}

// Exactly one JSON object, with strict schema types, required fields, and unique keys.
// Reject alias/canonical conflicts, including when either supplied value is null.
message ReadJsonObjectNode {
  FileMeta file = 1;
  delta.kernel.schema.StructType schema = 2;
  repeated JsonFieldAlias aliases = 3;
}
message ValuesNode {
  delta.kernel.schema.StructType schema = 1;
  repeated ValuesRow rows = 2;
}

// ============================================================================
// Transform payloads (1+ inputs)
// ============================================================================

message ProjectNode {
  delta.kernel.expressions.Expression expr = 1;
  delta.kernel.schema.StructType schema = 2;
}

message FilterNode {
  delta.kernel.expressions.Predicate predicate = 1;
}

message UnionAllNode {}

enum FileType {
  FILE_TYPE_UNSPECIFIED = 0;
  FILE_TYPE_PARQUET = 1;
  FILE_TYPE_JSON = 2;
}

message DynamicScanNode {
  delta.kernel.schema.StructType schema = 1;
  FileType file_type = 2;
  // Hierarchical base URL ending in `/` that relative file paths resolve against.
  string base_url = 3;
  repeated string file_constant_columns = 4;
  // Required input columns: path is STRING; size and last-modified are LONG.
  // Each column and every ancestor in its path must be non-nullable.
  delta.kernel.expressions.ColumnName path_column = 5;
  delta.kernel.expressions.ColumnName file_size_column = 6;
  delta.kernel.expressions.ColumnName last_modified_column = 7;
  delta.kernel.expressions.ColumnName dv_column = 8;
}

message MinAgg {
  delta.kernel.expressions.ColumnName value = 1;
}
message MaxAgg {
  delta.kernel.expressions.ColumnName value = 1;
}
message SumAgg {
  delta.kernel.expressions.ColumnName value = 1;
}
message CountAgg {
  delta.kernel.expressions.ColumnName value = 1;
}
message CountStarAgg {}
message MinNonNullByAgg {
  delta.kernel.expressions.ColumnName value = 1;
  delta.kernel.expressions.ColumnName null_sentinel = 2;
  delta.kernel.expressions.ColumnName key = 3;
}
message MaxNonNullByAgg {
  delta.kernel.expressions.ColumnName value = 1;
  delta.kernel.expressions.ColumnName null_sentinel = 2;
  delta.kernel.expressions.ColumnName key = 3;
}

message Agg {
  oneof func {
    MinAgg min = 1;
    MaxAgg max = 2;
    MinNonNullByAgg min_non_null_by = 3;
    MaxNonNullByAgg max_non_null_by = 4;
    SumAgg sum = 5;
    CountAgg count = 6;
    CountStarAgg count_star = 7;
  }
}

message AggregateNode {
  repeated delta.kernel.expressions.ColumnName group_by = 1;
  repeated Agg aggs = 2;
  delta.kernel.schema.StructType schema = 3;
}

message SemiJoinNode {
  bool inverted = 1;
  repeated delta.kernel.expressions.ColumnName probe_keys = 2;
  repeated delta.kernel.expressions.ColumnName build_keys = 3;
}

message ValidationAggregate {
  enum Function {
    FUNCTION_UNSPECIFIED = 0;
    COUNT_STAR = 1;
    COUNT = 2;
    SUM = 3;
  }
  Function function = 1;
  delta.kernel.expressions.ColumnName column = 2;
}

message AggregateCheck {
  ValidationAggregate aggregate = 1;
  delta.kernel.expressions.ColumnName expected = 2;
  bool required = 3;
}

// Inputs [actual, expected-singleton]. Preserve actual rows/schema. Accumulate globally over
// all partitions and compare only at successful exhaustion. Counts and non-negative LONG sums
// use checked i64 arithmetic; null SUM operands are errors and empty SUM is zero.
// Optional null expectations disable comparison. Errors may follow yielded rows. Optimizers must
// retain this operator and cannot push pruning or operand-changing projections beneath it.
// Early drop, cancellation, upstream errors, or short-circuiting consumers do not validate.
message ValidateAggregatesNode {
  repeated AggregateCheck checks = 1;
  string context = 2;
}

message ValueNormalization {
  repeated delta.kernel.expressions.ColumnName unordered_arrays = 1;
  repeated delta.kernel.expressions.ColumnName json_strings = 2;
  repeated delta.kernel.expressions.ColumnName ignored_fields = 3;
}

// Inputs [actual, expected-singleton]. Compare scalars or unordered collections including payload
// and multiplicity. Keys must be unique before retention exclusion. Null optional expectations
// mean absent; present empty arrays assert empty state. Normalization paths are value-relative.
// Emit {field: STRING, status: STRING}: checked, absent, partial, or unavailable. Mismatches error.
// The error-preservation obligations of ValidateAggregatesNode also apply here.
message ValidateRelationNode {
  delta.kernel.expressions.ColumnName actual = 1;
  delta.kernel.expressions.ColumnName expected = 2;
  bool collection = 3;
  repeated delta.kernel.expressions.ColumnName keys = 4;
  ValueNormalization normalization = 5;
  bool required = 6;
  bool available = 7;
  bool partial = 8;
  string context = 9;
  delta.kernel.expressions.ColumnName exclusion_column = 10;
  optional int64 exclusion_threshold = 11;
}

// Inputs [actual, expected-singleton]. Exactly one of boundary_column and fixed_boundaries is used.
// Inclusive lower bounds start at zero and strictly increase; the final bin has no upper bound.
// Arrays have identical lengths; counts and sums are non-negative LONGs with checked arithmetic.
// Null actual values error. Empty bins are zero. Output/optimizer rules match ValidateRelationNode.
message ValidateHistogramNode {
  delta.kernel.expressions.ColumnName value = 1;
  delta.kernel.expressions.ColumnName expected = 2;
  delta.kernel.expressions.ColumnName boundary_column = 3;
  repeated int64 fixed_boundaries = 4;
  delta.kernel.expressions.ColumnName counts = 5;
  delta.kernel.expressions.ColumnName sums = 6;
  string context = 7;
}

// ============================================================================
// Operator
// ============================================================================

message Operator {
  oneof op {
    // Sources (0 inputs)
    ScanParquetNode scan_parquet = 1;
    ScanJsonNode scan_json = 2;
    ValuesNode values = 3;
    // Transforms (1+ inputs)
    ProjectNode project = 4;
    FilterNode filter = 5;
    UnionAllNode union_all = 6;
    DynamicScanNode dynamic_scan = 7;
    AggregateNode aggregate = 8;
    SemiJoinNode semi_join = 9;
    ValidateAggregatesNode validate_aggregates = 10;
    ValidateRelationNode validate_relation = 11;
    ValidateHistogramNode validate_histogram = 12;
    ReadJsonObjectNode read_json_object = 13;
  }
}

// ============================================================================
// PlanNode / Plan
// ============================================================================

message PlanNode {
  Operator op = 1;
  // Indices into `Plan.nodes` of this node's upstream inputs. Each index is strictly less than
  // this node's own index, so `nodes` can be evaluated in order.
  repeated uint32 inputs = 2;
}

// The plan's terminal node is its last entry; the engine streams that node's rows.
message Plan {
  repeated PlanNode nodes = 1;
}
